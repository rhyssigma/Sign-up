<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            Signup page
        </title>
    </head>
    <body>
        <header>
            <h1>Create Your Account</h1>
        </header>
        <nav>
            <a href="signup.html">Sign-up</a>
            <a href="homepage.html">Home</a>
        </nav>
        <form>
            <label for="verity">First Name:</label> <br>
            <input type="text" id="verity" > <br>
            <label for="verity2">Last Name:</label> <br>
            <input type="text" id="verity2" > <br>
            <label for="verity3">Email Address:</label> <br>
            <input type="email" id="verity3" > <br>
            <p>Gender:</p> 
            <input type="radio" id="gender1" name="gender" value="male"> 
            <label for="gender1">Male</label> <br>
            <input type="radio" id="gender2" name="gender" value="female">
            <label for="gender2">Female</label> <br>
            <label for="verity4">Password:</label> <br>
            <input type="password" id="verity4" > <br>
            <button type="submit">Sign Up</button>
        </form>
    </body>
</html>
